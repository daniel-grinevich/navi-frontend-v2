name: Deploy production to GHCR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod-latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/production/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_ENVIRONMENT=production
            VITE_BASE_URL=https://api.navitascoffee.com
            VITE_OAUTH_ENABLED=false
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  update-manifests:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rainbow-road
        uses: actions/checkout@v5
        with:
          repository: daniel-grinevich/rainbow-road
          token: ${{ secrets.RAINBOW_ROAD_PAT }}

      - name: Update production image tag
        env:
          VERSION: ${{ needs.build-and-push-image.outputs.version }}
        run: |
          cd navi/production
          grep -q 'name: ghcr.io/daniel-grinevich/navi-frontend-v2' kustomization.yaml
          sed -i "/navi-frontend-v2/{n;s/newTag: .*/newTag: ${VERSION}/;}" kustomization.yaml

      - name: Commit and push when changed
        env:
          VERSION: ${{ needs.build-and-push-image.outputs.version }}
        run: |
          if git diff --quiet -- navi/production/kustomization.yaml; then
            echo "Production frontend already uses $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add navi/production/kustomization.yaml
          git commit -m "deploy frontend production: $VERSION"
          git push
